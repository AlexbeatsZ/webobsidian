plugins { id 'com.android.application' }

def androidVersion = new Properties()
rootProject.file('version.properties').withInputStream { androidVersion.load(it) }
def signingFile = rootProject.file('.signing/release.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'io.github.alexbeatsz.webobsidian'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'io.github.alexbeatsz.webobsidian'
        minSdk 30
        targetSdk 35
        versionCode androidVersion.versionCode.toInteger()
        versionName androidVersion.versionName
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file(signing.storeFile)
                storePassword signing.storePassword
                keyAlias signing.keyAlias
                keyPassword signing.keyPassword
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug'; debuggable true }
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    sourceSets.main { assets.srcDirs = ['../.gen']; jniLibs.srcDirs = ['../.runtime/bin'] }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    packaging { jniLibs { useLegacyPackaging = false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

tasks.register('requireReleaseKey') {
    doLast { if (!signingFile.exists()) throw new GradleException('Generate project-local signing material with node scripts/signing.mjs first.') }
}
tasks.configureEach { if (it.name == 'preReleaseBuild') it.dependsOn 'requireReleaseKey' }
